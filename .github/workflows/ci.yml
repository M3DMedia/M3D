name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  core-and-linux:
    name: Core and Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run core and Linux tests
        run: pytest -m "not macos"

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run macOS tests
        run: pytest -m macos
